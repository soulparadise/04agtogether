<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>04agtogether</title></head><body>
<h1>04agtogether</h1><p id="room" hidden></p><p id="connection" role="status">Получаем состояние…</p><p id="player"></p><p id="error" role="alert"></p>
<div id="nickname-row" hidden><label for="nickname">Ваш никнейм</label><input id="nickname" maxlength="32" autocomplete="nickname" placeholder="Как вас называть?"></div>
<button id="watch" disabled>Смотреть вместе</button><button id="copy" hidden>Копировать приглашение</button><input id="invitation" readonly hidden aria-label="Ссылка-приглашение"><button id="disconnect" hidden>Отключиться</button>
<section id="frames" hidden><p class="hint">Плеер может находиться во фрейме другого сайта. Доступ выдаётся только выбранному адресу.</p><div id="frame-buttons"></div></section>
<section id="selection" hidden><p id="source-choice"></p><div id="owner-voice" hidden><label for="player-choice">Плеер, выбранный на сайте</label><select id="player-choice"><option value="">Выбери вручную, если не определён</option><option value="venom">Full HD · player-venom</option><option value="allplay">Плеер 2 · Allplay</option><option value="playerjs">Плеер 3 · Playerjs</option></select><label for="voice-label">Озвучка, выбранная на сайте</label><input id="voice-label" maxlength="96" placeholder="Точное название озвучки"><button id="save-voice">Сообщить участникам</button></div><button id="confirm-choice" hidden>Я выбрал(а) плеер и озвучку владельца</button><p class="hint">Если переключатель сайта недоступен, выбери источник вручную. Подтверждение означает твой ручной выбор, а не автоматическую проверку.</p></section>
<p id="hint" class="hint"></p><script type="module" src="popup.js"></script></body></html>
